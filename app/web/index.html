<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Translation — Japanese Audio</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
      h1 { font-size: 1.4rem; }
      button { padding: 0.9rem 2rem; font-size: 1.1rem; border-radius: 8px; border: none; background: #0b7; color: #fff; cursor: pointer; }
      button:disabled { background: #ccc; }
      #status { margin-top: 1.5rem; color: #555; }
      .hint { margin-top: 2rem; color: #888; font-size: 0.9rem; }
      /* Captions. Nothing here applies until the first caption arrives (html.live), so before that the page is
         exactly the page without captions. Once live, the page is one viewport tall and never scrolls: the
         Japanese area (primary) and the English area (secondary) have fixed heights (line-height x lines),
         are bottom-anchored, and clip older lines at the top with a soft fade. */
      /* overflow on html only (propagates to the viewport); on body it would stop the h1 margin from collapsing
         and move the button. */
      html.live { overflow: hidden; height: 100vh; height: 100dvh; }
      html.live body { margin-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
      #captions-ja, #captions-en {
        display: none; flex-direction: column; justify-content: flex-end; overflow: hidden; line-height: 1.5;
        position: relative; left: 50%; transform: translateX(-50%); box-sizing: content-box;
      }
      #captions-ja.on, #captions-en.on { display: flex; }
      #captions-ja { --lines: 3; width: min(calc(100vw - 2rem), 36em); height: calc(1.5em * var(--lines)); margin-top: 1.5rem;
        font-size: clamp(1.05rem, min(2.2vw + 0.6rem, 4.2vh), 2.6rem); }
      #captions-en { --lines: 2; width: min(calc(100vw - 2rem), 34em); height: calc(1.5em * var(--lines)); margin-top: 0.75rem; color: #555;
        font-size: clamp(0.85rem, min(1.4vw + 0.5rem, 2.8vh), 1.7rem); }
      #captions-ja.clipped, #captions-en.clipped { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.2em); mask-image: linear-gradient(to bottom, transparent 0, #000 1.2em); }
      #captions-ja div, #captions-en div { transition: opacity 0.6s; overflow-wrap: anywhere; flex: none; }
      #captions-ja .old { color: #555; }
      #captions-en .old { color: #666; }
      #captions-ja .fading, #captions-en .fading { opacity: 0; }
      @media (max-height: 700px) { html.live .hint { display: none; } }
      @media (max-height: 500px) {
        #captions-ja { --lines: 2; margin-top: 0.75rem; }
        #captions-en { --lines: 1; margin-top: 0.25rem; }
        html.live #status { margin-top: 0.75rem; }
      }
      @media (prefers-reduced-motion: reduce) { #captions-ja div, #captions-en div { transition: none; } }
    </style>
  </head>
  <body>
    <h1>Live Translation (日本語音声)</h1>
    <p>Put on your headphones and press Listen to hear the Japanese translation.</p>
    <button id="listen">Listen / 聴く</button>
    <div id="status">Not connected</div>
    <p class="hint">
      If you hear nothing, tap the button again — your browser may require a tap to
      start audio.
    </p>
    <div id="captions-ja" aria-live="polite" aria-atomic="false"></div>
    <div id="captions-en" aria-live="off"></div>
    <script type="module" src="./subscriber.js"></script>
  </body>
</html>
