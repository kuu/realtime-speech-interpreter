<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live Translation — Japanese Audio</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
      h1 { font-size: 1.4rem; }
      button { padding: 0.9rem 2rem; font-size: 1.1rem; border-radius: 8px; border: none; background: #0b7; color: #fff; cursor: pointer; }
      button:disabled { background: #ccc; }
      #status { margin-top: 1.5rem; color: #555; }
      .hint { margin-top: 2rem; color: #888; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Live Translation (日本語音声)</h1>
    <p>Put on your headphones and press Listen to hear the Japanese translation.</p>
    <button id="listen">Listen / 聴く</button>
    <div id="status">Not connected</div>
    <p class="hint">
      If you hear nothing, tap the button again — your browser may require a tap to
      start audio.
    </p>
    <script type="module" src="./subscriber.js"></script>
  </body>
</html>
